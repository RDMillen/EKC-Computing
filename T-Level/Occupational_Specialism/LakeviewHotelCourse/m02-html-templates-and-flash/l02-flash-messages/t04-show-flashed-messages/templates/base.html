<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lakeview Hotel</title>
</head>
<body>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="alert alert-{{ category }}" role="alert">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
